<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Merve &amp; Devran Nişanı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Nunito:wght@400;600;700&display=swap">
<style>
/* ─── TOKENS ──────────────────────────────────────────── */
:root {
  --cream:      #F8F5F0;
  --rose:       #C9A88A;      /* invitation rose-gold */
  --rose-dark:  #A5784E;
  --ink:        #1E1714;
  --sepia:      #7A6452;
  --shadow:     rgba(30,23,20,0.18);
}

/* ─── BASE ────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--cream); }
body {
  min-height: 100svh;
  background: var(--cream);
  font-family: 'Nunito', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 12px env(safe-area-inset-bottom, 12px);
}

/* ─── CARD ────────────────────────────────────────────── */
.card {
  width: 100%;
  max-width: 500px;
  box-shadow: 0 2px 8px var(--shadow), 0 12px 40px rgba(30,23,20,0.12);
  background: var(--cream);
}

/* ─── INVITE WRAP — image + overlays ─────────────────── */
.invite-wrap {
  position: relative;
  width: 100%;
  background: var(--cream); /* seamless extension below image */
  /* Extra height below image is set by JS after load */
}

.invite-img {
  display: block;
  width: 100%;
  height: auto;
}

/* ── OVERLAY: Takvime Ekle (transparent hit area on date section) ── */
/* Positions are set by JS. The calendar badge appears on hover.     */
.overlay-calendar {
  position: absolute;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 1%;
  /* Completely transparent — invitation design shows through */
}

.cal-badge {
  pointer-events: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(248,245,240,0.88);
  border: 1px solid rgba(201,168,138,0.5);
  border-radius: 2px;
  padding: 4px 10px;
  font-size: clamp(9px, 2vw, 12px);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--sepia);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.22s ease, transform 0.22s ease;
}

.overlay-calendar:hover .cal-badge,
.overlay-calendar:focus-visible .cal-badge { opacity: 1; transform: translateY(0); }
.overlay-calendar:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

/* ── OVERLAY: RSVP form (transparent, over bottom of image) ── */
/* Positions are set by JS                                      */
.overlay-form {
  position: absolute;
}

/* Name input — transparent, bottom-border only */
.form-name {
  display: block;
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1.2px solid rgba(30,23,20,0.30);
  padding: 2px 0 3px;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(13px, 3.8vw, 20px);
  font-style: italic;
  color: var(--ink);
  outline: none;
  caret-color: var(--rose-dark);
  -webkit-appearance: none;
}

.form-name::placeholder { color: rgba(30,23,20,0.30); }
.form-name:focus { border-bottom-color: var(--rose); }

/* Gap between name and radios — set dynamically */
.form-gap { display: block; }

/* Radio choices */
.rsvp-choices {
  display: flex;
  align-items: center;
  gap: clamp(14px, 6vw, 32px);
}

.choice { display: flex; align-items: center; gap: 6px; cursor: pointer; }

.choice input[type="radio"] {
  appearance: none; -webkit-appearance: none;
  width:  clamp(13px, 3.2vw, 18px);
  height: clamp(13px, 3.2vw, 18px);
  border: 1.2px solid rgba(30,23,20,0.35);
  border-radius: 50%;
  background: transparent;
  cursor: pointer; flex-shrink: 0;
  transition: border-color 0.15s, background 0.15s;
}

.choice input[type="radio"]:checked {
  background: var(--rose);
  border-color: var(--rose);
  box-shadow: inset 0 0 0 2.5px var(--cream);
}

.choice-text {
  font-size: clamp(10px, 2.8vw, 14px);
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--ink);
  user-select: none;
  white-space: nowrap;
}

/* ── Error hint ─────────────────────────────────────────── */
.form-error {
  position: absolute;
  bottom: calc(100% + 4px);
  left: 0;
  background: rgba(180,60,30,0.88);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 2px;
  white-space: nowrap;
  display: none;
}
.form-error.show { display: block; }

/* ─── CONFIRMATION MODAL ──────────────────────────────── */
.confirm-modal {
  position: fixed; inset: 0;
  background: rgba(248,245,240,0.97);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none; /* toggle to flex */
  flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  z-index: 50;
  padding: 40px 28px;
}
.confirm-modal.open { display: flex; }

.confirm-icon { color: var(--rose); margin-bottom: 18px; }

.confirm-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(22px, 6vw, 30px);
  font-style: italic;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 12px;
  text-wrap: balance;
  line-height: 1.25;
}

.confirm-title em { font-style: normal; color: var(--rose-dark); }

.confirm-body {
  font-size: 13.5px; color: var(--sepia);
  line-height: 1.7; max-width: 26ch;
  text-wrap: balance; margin-bottom: 28px;
}

.btn-edit {
  background: none; border: none;
  border-bottom: 1px solid currentColor;
  font-family: 'Nunito', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--sepia); cursor: pointer; padding-bottom: 2px;
}
.btn-edit:hover { color: var(--ink); }
.btn-edit:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }

/* ─── VINYL PLAYER ────────────────────────────────────── */
.vinyl-player {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  right: 20px;
  z-index: 100;
  width: clamp(56px, 14vw, 72px);
  height: clamp(56px, 14vw, 72px);
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.vinyl-disc {
  width: 100%; height: 100%;
  border-radius: 50%;
  box-shadow: 0 3px 14px rgba(0,0,0,0.32);
  transition: box-shadow 0.25s;
  will-change: transform;
}

.vinyl-player:hover .vinyl-disc {
  box-shadow: 0 3px 14px rgba(0,0,0,0.40), 0 0 0 3px rgba(201,168,138,0.45);
}

@keyframes spinVinyl {
  to { transform: rotate(360deg); }
}

.vinyl-player.playing .vinyl-disc {
  animation: spinVinyl 3.5s linear infinite;
  box-shadow: 0 3px 14px rgba(0,0,0,0.40), 0 0 0 3px rgba(201,168,138,0.55);
}

/* Pause icon — shows when playing */
.vinyl-pause {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s;
  pointer-events: none;
}
.vinyl-player.playing:hover .vinyl-pause { opacity: 1; }
.vinyl-pause svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6)); }

/* ─── REDUCED MOTION ──────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .cal-badge, .choice input[type="radio"] { transition: none; }
  .vinyl-player.playing .vinyl-disc { animation: none; }
}
</style>
</head>
<body>

<div class="card">
  <div class="invite-wrap" id="inviteWrap">

    <img
      src="davetiye.jpeg"
      alt="Merve &amp; Devran Nişan Daveti – 10 Ekim 2026"
      class="invite-img"
      id="inviteImg"
    >

    <!-- ── Takvime Ekle: şeffaf tıklanabilir alan (tarih+mekan bölümü üzerinde) ── -->
    <!-- Konum JS ile ayarlanır; değiştirmek için positionOverlays() içindeki % değerlerini düzenleyin -->
    <a class="overlay-calendar" id="calendarOverlay" href="#" target="_blank" rel="noopener noreferrer" aria-label="Nişanı Google Takvim'e ekle">
      <span class="cal-badge">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="1" y="2" width="14" height="13" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M5 1v2M11 1v2M1 6h14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <rect x="4" y="9" width="2" height="2" rx=".4" fill="currentColor"/>
          <rect x="7" y="9" width="2" height="2" rx=".4" fill="currentColor"/>
          <rect x="10" y="9" width="2" height="2" rx=".4" fill="currentColor"/>
        </svg>
        Takvime Ekle
      </span>
    </a>

    <!-- ── RSVP Formu: şeffaf overlay (görselin alt beyaz alanı üzerinde) ── -->
    <!-- Konum JS ile ayarlanır; değiştirmek için positionOverlays() içindeki % değerlerini düzenleyin -->
    <div class="overlay-form" id="formOverlay">

      <!-- ⚠️  Formspree kurulumu (1 dakika):                          -->
      <!--   1. formspree.io → "Get Started" → ücretsiz kayıt         -->
      <!--   2. "+ New Form" → email adresinizi girin                  -->
      <!--   3. Oluşturulan formdaki ID'yi (örn. xabcd123) aşağıya    -->
      <!--      yapıştırın: https://formspree.io/f/FORM_ID_BURAYA      -->
      <form
        id="rsvpForm"
        action="https://formspree.io/f/FORM_ID_BURAYA"
        method="POST"
        novalidate
        style="position:relative"
      >
        <!-- Spam koruması -->
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
        <input type="hidden" name="_subject" value="Nişan RSVP – Merve &amp; Devran">

        <!-- Ad Soyad -->
        <input
          type="text"
          name="ad_soyad"
          id="guestName"
          class="form-name"
          placeholder="Ad Soyad"
          autocomplete="name"
          autocorrect="off"
          spellcheck="false"
        >

        <span class="form-gap" id="formGap"></span>

        <!-- Geliyorum / Gelmiyorum -->
        <div class="rsvp-choices">
          <label class="choice">
            <input type="radio" name="rsvp" value="Geliyorum" id="radioGeliyorum">
            <span class="choice-text">Geliyorum</span>
          </label>
          <label class="choice">
            <input type="radio" name="rsvp" value="Gelmiyorum" id="radioGelmiyorum">
            <span class="choice-text">Gelmiyorum</span>
          </label>
        </div>

        <!-- Hata mesajı (isim boşsa) -->
        <span class="form-error" id="formError" role="alert">Lütfen adınızı giriniz.</span>

      </form>
    </div>

  </div><!-- /.invite-wrap -->
</div><!-- /.card -->

<!-- Onay ekranı -->
<div class="confirm-modal" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <svg class="confirm-icon" width="54" height="54" viewBox="0 0 54 54" fill="none" aria-hidden="true">
    <circle cx="27" cy="27" r="24.5" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5.5 4"/>
    <path d="M17 29l7.5 7.5 12.5-13.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <p class="confirm-title" id="confirmTitle"></p>
  <p class="confirm-body"  id="confirmBody"></p>
  <button class="btn-edit" id="btnEdit" type="button">Değiştir</button>
</div>

<!-- Plak çalar -->
<div class="vinyl-player" id="vinyl" role="button" tabindex="0" aria-label="Müziği başlat / durdur">
  <svg class="vinyl-disc" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
    <!-- Ana plak -->
    <circle cx="36" cy="36" r="35.5" fill="#1A1614"/>
    <!-- Oluk halkaları -->
    <circle cx="36" cy="36" r="32" fill="none" stroke="#2C2420" stroke-width="1"/>
    <circle cx="36" cy="36" r="28" fill="none" stroke="#2C2420" stroke-width="0.6"/>
    <circle cx="36" cy="36" r="24" fill="none" stroke="#2C2420" stroke-width="0.6"/>
    <circle cx="36" cy="36" r="20" fill="none" stroke="#2C2420" stroke-width="0.6"/>
    <!-- Etiket alanı (rose-gold) -->
    <circle cx="36" cy="36" r="16" fill="#B8924A"/>
    <circle cx="36" cy="36" r="14" fill="#C9A36A"/>
    <!-- Monogram -->
    <text x="36" y="33" text-anchor="middle" fill="#FAF5EF" font-size="6.5" font-family="Georgia,serif" font-style="italic" font-weight="400">M &amp; D</text>
    <text x="36" y="42" text-anchor="middle" fill="#FAF5EF" font-size="9" font-family="Georgia,serif">♪</text>
    <!-- Merkez delik -->
    <circle cx="36" cy="36" r="3" fill="#1A1614"/>
    <!-- Parlaklık vurgusu -->
    <ellipse cx="23" cy="21" rx="5" ry="3" fill="white" opacity="0.07" transform="rotate(-30 23 21)"/>
  </svg>
  <!-- Duraklat ikonu (çalarken hover'da görünür) -->
  <div class="vinyl-pause">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <rect x="5" y="4" width="3.5" height="12" rx="1" fill="white"/>
      <rect x="11.5" y="4" width="3.5" height="12" rx="1" fill="white"/>
    </svg>
  </div>
</div>

<audio id="bgMusic" src="muzik.mp3" preload="none"></audio>

<script>
(function () {
  'use strict';

  /* ── Yardımcı ── */
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ═══════════════════════════════════════════════════════
     1. Overlay Konumlandırma (JS ile responsive)
     ═══════════════════════════════════════════════════════
     Görselin üzerindeki tüm overlay'ler, resmin gerçek
     piksel boyutuna göre konumlandırılır. Böylece ekran
     büyüklüğü ne olursa olsun doğru yerlerde kalır.

     Konumları değiştirmek için aşağıdaki % değerlerini
     davetiyenizdeki çizili alanlara göre ayarlayın:
  */
  var POS = {
    calendar: { top: 0.615, left: 0.05, w: 0.90, h: 0.265 }, /* tarih+mekan bölümü */
    form:     { top: 0.915, left: 0.08, w: 0.84 },             /* alt beyaz alan     */
    gapRatio: 0.028,   /* isim ile radyo arasındaki boşluk (görsel yüksekliğine oranı) */
    extraPad: 0.145    /* görsel altına eklenen ekstra boşluk oranı (form alanı için)  */
  };

  var inviteImg  = document.getElementById('inviteImg');
  var inviteWrap = document.getElementById('inviteWrap');
  var calOverlay = document.getElementById('calendarOverlay');
  var formOverlay= document.getElementById('formOverlay');
  var formGap    = document.getElementById('formGap');

  function positionOverlays() {
    var h = inviteImg.offsetHeight;
    var w = inviteImg.offsetWidth;
    if (!h || !w) return;

    /* Takvime Ekle alanı */
    calOverlay.style.top    = (h * POS.calendar.top)  + 'px';
    calOverlay.style.left   = (w * POS.calendar.left) + 'px';
    calOverlay.style.width  = (w * POS.calendar.w)    + 'px';
    calOverlay.style.height = (h * POS.calendar.h)    + 'px';

    /* Form overlay */
    formOverlay.style.top   = (h * POS.form.top)  + 'px';
    formOverlay.style.left  = (w * POS.form.left) + 'px';
    formOverlay.style.width = (w * POS.form.w)    + 'px';

    /* İsim ile radyo arasındaki boşluk */
    formGap.style.display    = 'block';
    formGap.style.height     = (h * POS.gapRatio) + 'px';

    /* Görsel altına ekstra beyaz alan (form elemanları için) */
    inviteWrap.style.paddingBottom = (h * POS.extraPad) + 'px';
  }

  if (inviteImg.complete) {
    positionOverlays();
  } else {
    inviteImg.addEventListener('load', positionOverlays);
  }
  window.addEventListener('resize', positionOverlays);

  /* ═══════════════════════════════════════════════════════
     2. Google Calendar URL
     ═══════════════════════════════════════════════════════ */
  (function () {
    var p = new URLSearchParams({
      text:     'Merve & Devran Nişanı',
      dates:    '20261010T160000Z/20261010T190000Z', /* 19:00–22:00 Türkiye (UTC+3) */
      details:  'Merve ve Devran\'ın nişan töreni.\nEver After - World Point, Büyükçekmece',
      location: 'Ever After - World Point, Büyükçekmece',
      ctz:      'Europe/Istanbul'
    });
    calOverlay.href = 'https://calendar.google.com/calendar/r/eventedit?' + p.toString();
  })();

  /* ═══════════════════════════════════════════════════════
     3. RSVP Formu (Formspree + onay ekranı)
     ═══════════════════════════════════════════════════════ */
  var form        = document.getElementById('rsvpForm');
  var nameInput   = document.getElementById('guestName');
  var radios      = form.querySelectorAll('input[type="radio"]');
  var formError   = document.getElementById('formError');
  var confirmModal= document.getElementById('confirmModal');
  var confirmTitle= document.getElementById('confirmTitle');
  var confirmBody = document.getElementById('confirmBody');
  var btnEdit     = document.getElementById('btnEdit');

  function showConfirm(name, coming) {
    confirmTitle.innerHTML = coming
      ? 'Görüşmek üzere, <em>' + esc(name) + '</em>!'
      : 'Anlıyoruz, <em>' + esc(name) + '</em>.';
    confirmBody.textContent = coming
      ? 'Katılımınızı bildirdiniz. Sizi aramızda görmekten mutluluk duyacağız.'
      : 'Katılamayacağınızı bildirdiniz. Umarız başka bir zaman bir arada oluruz.';
    confirmModal.classList.add('open');
    btnEdit.focus();
  }

  /* Radio seçilince otomatik gönder */
  radios.forEach(function (r) {
    r.addEventListener('change', function () {
      var name = nameInput.value.trim();
      if (!name) {
        formError.classList.add('show');
        nameInput.focus();
        return;
      }
      formError.classList.remove('show');
      submitForm(name, r.value);
    });
  });

  nameInput.addEventListener('input', function () {
    if (this.value.trim()) formError.classList.remove('show');
  });

  async function submitForm(name, rsvp) {
    var fd = new FormData(form);
    fd.set('rsvp', rsvp);

    /* Formspree AJAX gönderimi */
    try {
      var res = await fetch(form.action, {
        method: 'POST',
        body:   fd,
        headers: { 'Accept': 'application/json' }
      });
      /* Başarı veya hata — her durumda onay ekranını göster */
    } catch (_) { /* Ağ hatası — yine de onay göster */ }

    showConfirm(name, rsvp === 'Geliyorum');

    try {
      localStorage.setItem('davetiye_name', name);
      localStorage.setItem('davetiye_rsvp',  rsvp);
    } catch (_) {}
  }

  btnEdit.addEventListener('click', function () {
    confirmModal.classList.remove('open');
    nameInput.focus();
  });

  /* Sayfa yenilendiğinde önceki cevabı göster */
  try {
    var sName = localStorage.getItem('davetiye_name');
    var sRsvp = localStorage.getItem('davetiye_rsvp');
    if (sName && sRsvp) {
      nameInput.value = sName;
      var prev = form.querySelector('input[value="' + sRsvp + '"]');
      if (prev) prev.checked = true;
      showConfirm(sName, sRsvp === 'Geliyorum');
    }
  } catch (_) {}

  /* ═══════════════════════════════════════════════════════
     4. Plak Çalar (Vinyl Player)
     ═══════════════════════════════════════════════════════ */
  var vinyl   = document.getElementById('vinyl');
  var music   = document.getElementById('bgMusic');
  var playing = false;

  function toggleMusic() {
    playing = !playing;
    vinyl.classList.toggle('playing', playing);
    vinyl.setAttribute('aria-label', playing ? 'Müziği durdur' : 'Müziği başlat');

    if (playing) {
      music.play().catch(function () {
        playing = false;
        vinyl.classList.remove('playing');
        vinyl.setAttribute('aria-label', 'Müziği başlat');
      });
    } else {
      music.pause();
    }
  }

  vinyl.addEventListener('click', toggleMusic);

  vinyl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggleMusic();
    }
  });

  music.addEventListener('ended', function () {
    playing = false;
    vinyl.classList.remove('playing');
    vinyl.setAttribute('aria-label', 'Müziği başlat');
  });

})();
</script>

</body>
</html>
