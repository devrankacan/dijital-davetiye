# nisan.taslak.site — Nginx sanal sunucu konfigürasyonu
# Konum: /etc/nginx/sites-available/nisan.taslak.site
# Sembolik bağ: ln -s /etc/nginx/sites-available/nisan.taslak.site /etc/nginx/sites-enabled/

# HTTP → HTTPS yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name nisan.taslak.site;

    # Certbot doğrulaması için (SSL kurulumunda gerekli)
    location /.well-known/acme-challenge/ {
        root /var/www/nisan;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — asıl site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nisan.taslak.site;

    root  /var/www/nisan;
    index index.html;

    # SSL sertifikaları (certbot kurulumundan sonra otomatik dolar)
    ssl_certificate     /etc/letsencrypt/live/nisan.taslak.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nisan.taslak.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Statik dosya yönlendirmesi
    location / {
        try_files $uri $uri/ =404;
    }

    # Medya dosyaları için uzun önbellekleme
    location ~* \.(jpeg|jpg|png|gif|ico|mp3|mp4|webp|woff2)$ {
        expires     30d;
        add_header  Cache-Control "public, immutable";
    }

    # Güvenlik başlıkları
    add_header X-Frame-Options       SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy       strict-origin-when-cross-origin;
}
