# nisan.taslak.site
# Konum: /etc/nginx/sites-available/nisan.taslak.site

# HTTP → HTTPS yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name nisan.taslak.site;

    location /.well-known/acme-challenge/ {
        root /var/www/davetiye;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nisan.taslak.site;

    root  /var/www/davetiye;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/nisan.taslak.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nisan.taslak.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    location /send {
        proxy_pass http://127.0.0.1:3333;
        proxy_set_header Host $host;
    }

    location ~* \.(jpeg|jpg|mp3|png|ico|webp)$ {
        expires    30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
}
